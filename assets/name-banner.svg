<svg width="880" height="210" viewBox="0 0 880 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Evans He — Business-native AI Product Builder">
  <defs>
    <!-- Flowing color gradient for the name fill -->
    <linearGradient id="flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2f62ff">
        <animate attributeName="stop-color" values="#2f62ff;#7c3aed;#06b6d4;#2f62ff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#7c3aed">
        <animate attributeName="stop-color" values="#7c3aed;#06b6d4;#2f62ff;#7c3aed" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#2f62ff;#7c3aed;#06b6d4" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Metallic bevel: light top edge, shaded bottom edge -->
    <linearGradient id="bevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.22"/>
    </linearGradient>

    <!-- Sheen band that sweeps across the letters -->
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Underline gradient -->
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f62ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft neon glow -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
      </feMerge>
    </filter>

    <!-- Letter shapes reused as clip for bevel + sheen -->
    <clipPath id="nameClip">
      <text x="440" y="112" text-anchor="middle"
            font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-weight="800" font-size="92" letter-spacing="5">EVANS HE</text>
    </clipPath>
  </defs>

  <!-- Glow layer -->
  <text x="440" y="112" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-weight="800" font-size="92" letter-spacing="5"
        fill="url(#flow)" filter="url(#glow)" opacity="0.6">EVANS HE</text>

  <!-- Crisp name -->
  <text x="440" y="112" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-weight="800" font-size="92" letter-spacing="5"
        fill="url(#flow)">EVANS HE</text>

  <!-- Metallic bevel overlay, clipped to the letters -->
  <g clip-path="url(#nameClip)">
    <rect x="0" y="20" width="880" height="100" fill="url(#bevel)"/>
  </g>

  <!-- Sweeping sheen, clipped to the letters -->
  <g clip-path="url(#nameClip)">
    <g transform="skewX(-20)">
      <rect x="0" y="0" width="150" height="210" fill="url(#sheen)">
        <animateTransform attributeName="transform" type="translate"
                          values="-320 0; 1150 0" dur="3.8s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Underline flourish -->
  <rect x="240" y="134" width="400" height="3" rx="1.5" fill="url(#rule)">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="3.8s" repeatCount="indefinite"/>
  </rect>

  <!-- Subtitle with flanking accents -->
  <g fill="#8b949e">
    <text x="440" y="176" text-anchor="middle"
          font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-weight="600" font-size="19" letter-spacing="5">BUSINESS-NATIVE AI PRODUCT BUILDER</text>
  </g>
  <g>
    <rect x="52" y="168" width="60" height="1.5" fill="#8b949e" opacity="0.5"/>
    <rect x="768" y="168" width="60" height="1.5" fill="#8b949e" opacity="0.5"/>
    <path d="M 122 169 l 6 -6 l 6 6 l -6 6 z" fill="#7c3aed" opacity="0.85"/>
    <path d="M 746 169 l 6 -6 l 6 6 l -6 6 z" fill="#06b6d4" opacity="0.85"/>
  </g>
</svg>
