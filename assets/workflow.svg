<svg width="880" height="190" viewBox="0 0 880 190" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Workflow: research, structure, prototype, validate, automate">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#0e1728"/>
    </linearGradient>
    <linearGradient id="flowline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f62ff"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#22304a"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Panel -->
  <rect x="0.5" y="0.5" width="879" height="189" rx="18" fill="url(#panel)" stroke="#243352"/>
  <rect x="0.5" y="0.5" width="879" height="189" rx="18" fill="url(#dots)" opacity="0.55"/>

  <!-- Base connector -->
  <line x1="110" y1="76" x2="770" y2="76" stroke="#243352" stroke-width="2"/>
  <!-- Animated dash flow -->
  <line x1="110" y1="76" x2="770" y2="76" stroke="url(#flowline)" stroke-width="2" stroke-dasharray="7 11" opacity="0.9">
    <animate attributeName="stroke-dashoffset" values="0;-18" dur="0.9s" repeatCount="indefinite"/>
  </line>
  <!-- Traveling pulse (slides under the nodes) -->
  <g>
    <circle r="9" fill="#9db7ff" opacity="0.5" filter="url(#soft)">
      <animateMotion path="M 110 76 L 770 76" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#ffffff" opacity="0.95">
      <animateMotion path="M 110 76 L 770 76" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Stage 1 · research -->
  <g transform="translate(110 76)">
    <circle r="26" fill="#2f62ff" opacity="0.32" filter="url(#soft)"/>
    <circle r="31" fill="none" stroke="#2f62ff" stroke-opacity="0.28"/>
    <circle r="26" fill="#0d1526" stroke="#2f62ff" stroke-width="2.5"/>
    <g stroke="#e6edf3" stroke-width="2.2" fill="none" stroke-linecap="round">
      <circle cx="-2.5" cy="-2.5" r="6.5"/>
      <line x1="2.5" y1="2.5" x2="8.5" y2="8.5"/>
    </g>
  </g>
  <text x="110" y="130" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="14" letter-spacing="1.5" fill="#c9d1d9">RESEARCH</text>
  <text x="110" y="151" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">调研取证</text>

  <!-- Stage 2 · structure -->
  <g transform="translate(275 76)">
    <circle r="26" fill="#6a4df2" opacity="0.32" filter="url(#soft)"/>
    <circle r="31" fill="none" stroke="#6a4df2" stroke-opacity="0.28"/>
    <circle r="26" fill="#0d1526" stroke="#6a4df2" stroke-width="2.5"/>
    <g stroke="#e6edf3" stroke-width="2.2" fill="none" stroke-linecap="round">
      <line x1="-8" y1="-7" x2="8" y2="-7"/>
      <line x1="-8" y1="0" x2="8" y2="0"/>
      <line x1="-8" y1="7" x2="2" y2="7"/>
    </g>
  </g>
  <text x="275" y="130" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="14" letter-spacing="1.5" fill="#c9d1d9">STRUCTURE</text>
  <text x="275" y="151" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">结构化</text>

  <!-- Stage 3 · prototype -->
  <g transform="translate(440 76)">
    <circle r="26" fill="#7c3aed" opacity="0.32" filter="url(#soft)"/>
    <circle r="31" fill="none" stroke="#7c3aed" stroke-opacity="0.28"/>
    <circle r="26" fill="#0d1526" stroke="#7c3aed" stroke-width="2.5"/>
    <path d="M 2 -10 L -6.5 2 L -1.5 2 L -2.5 10 L 6 -2 L 1 -2 Z" fill="#e6edf3"/>
  </g>
  <text x="440" y="130" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="14" letter-spacing="1.5" fill="#c9d1d9">PROTOTYPE</text>
  <text x="440" y="151" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">原型</text>

  <!-- Stage 4 · validate -->
  <g transform="translate(605 76)">
    <circle r="26" fill="#22a6c4" opacity="0.32" filter="url(#soft)"/>
    <circle r="31" fill="none" stroke="#22a6c4" stroke-opacity="0.28"/>
    <circle r="26" fill="#0d1526" stroke="#22a6c4" stroke-width="2.5"/>
    <path d="M -7.5 0.5 L -2 6 L 7.5 -6" fill="none" stroke="#e6edf3" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="605" y="130" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="14" letter-spacing="1.5" fill="#c9d1d9">VALIDATE</text>
  <text x="605" y="151" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">验证</text>

  <!-- Stage 5 · automate -->
  <g transform="translate(770 76)">
    <circle r="26" fill="#06b6d4" opacity="0.32" filter="url(#soft)"/>
    <circle r="31" fill="none" stroke="#06b6d4" stroke-opacity="0.28"/>
    <circle r="26" fill="#0d1526" stroke="#06b6d4" stroke-width="2.5"/>
    <g>
      <path d="M 7.2 -2.6 A 7.6 7.6 0 1 0 7.2 2.6" fill="none" stroke="#e6edf3" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M 4.4 -6.8 L 11.2 -3.4 L 4.6 -0.4 Z" fill="#e6edf3"/>
    </g>
  </g>
  <text x="770" y="130" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="14" letter-spacing="1.5" fill="#c9d1d9">AUTOMATE</text>
  <text x="770" y="151" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">自动化</text>

  <!-- Loop-back hint: automate feeds research -->
  <path d="M 800 76 C 848 76, 848 168, 730 168 L 585 168" fill="none" stroke="#2c3d5e" stroke-width="1.5" stroke-dasharray="3 6"/>
  <path d="M 295 168 L 150 168 C 32 168, 32 76, 78 76" fill="none" stroke="#2c3d5e" stroke-width="1.5" stroke-dasharray="3 6"/>
  <path d="M 76 70 L 84 76 L 76 82 Z" fill="#3a5480"/>
  <text x="440" y="172" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" letter-spacing="2" fill="#5a6b85">REUSABLE BY DEFAULT · 沉淀复用</text>
</svg>
