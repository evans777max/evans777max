<svg width="430" height="210" viewBox="0 0 430 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="dev-skills：把设计审美与工程纪律写成 AI Agent 能读懂的规则，零框架依赖">
  <defs>
    <linearGradient id="panel2" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#0c1322"/>
      <stop offset="1" stop-color="#141531"/>
    </linearGradient>
    <radialGradient id="orb2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tick2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#2f62ff"/>
    </linearGradient>
    <clipPath id="panelClip2">
      <rect x="0.5" y="0.5" width="429" height="209" rx="16"/>
    </clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="429" height="209" rx="16" fill="url(#panel2)" stroke="#26334d"/>
  <g clip-path="url(#panelClip2)">
    <circle cx="392" cy="10" r="105" fill="url(#orb2)">
      <animate attributeName="r" values="105;120;105" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- accent tick + spark icon + title -->
  <rect x="28" y="24" width="44" height="4" rx="2" fill="url(#tick2)"/>
  <g transform="translate(41 55)">
    <path d="M 0 -12 L 3 -3 L 12 0 L 3 3 L 0 12 L -3 3 L -12 0 L -3 -3 Z" fill="none" stroke="#b794f6" stroke-width="1.8" stroke-linejoin="round"/>
    <circle r="2.4" fill="#b794f6"/>
  </g>
  <text x="62" y="61" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', Helvetica, Arial, sans-serif" font-weight="800" font-size="24" fill="#e6edf3">dev-skills</text>

  <!-- corner tag -->
  <rect x="310" y="22" width="92" height="20" rx="10" fill="none" stroke="#7c3aed" stroke-opacity="0.55"/>
  <text x="356" y="36.5" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', Helvetica, Arial, sans-serif" font-weight="700" font-size="10" letter-spacing="1.5" fill="#b794f6">AGENT 技能</text>

  <!-- tagline -->
  <text x="28" y="90" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', Helvetica, Arial, sans-serif" font-size="13" fill="#94a3b8">把设计审美与工程纪律，写成 AI Agent</text>
  <text x="28" y="109" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', Helvetica, Arial, sans-serif" font-size="13" fill="#94a3b8">能读懂的规则。零框架依赖。</text>

  <!-- chips -->
  <g font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', Helvetica, Arial, sans-serif" font-size="11" fill="#c3b1e8">
    <rect x="28" y="124" width="92" height="24" rx="12" fill="#1a1832" stroke="#7c3aed" stroke-opacity="0.45"/>
    <text x="74" y="140.5" text-anchor="middle">UI 设计系统</text>
    <rect x="128" y="124" width="120" height="24" rx="12" fill="#1a1832" stroke="#7c3aed" stroke-opacity="0.45"/>
    <text x="188" y="140.5" text-anchor="middle">PPT · Excel 生成</text>
    <rect x="28" y="154" width="124" height="24" rx="12" fill="#1a1832" stroke="#2f62ff" stroke-opacity="0.45"/>
    <text x="90" y="170.5" text-anchor="middle">Playwright 自动化</text>
    <rect x="160" y="154" width="102" height="24" rx="12" fill="#1a1832" stroke="#2f62ff" stroke-opacity="0.45"/>
    <text x="211" y="170.5" text-anchor="middle">Kiro 可直接装</text>
  </g>

  <!-- footer -->
  <text x="28" y="196" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', Helvetica, Arial, sans-serif" font-size="11" fill="#b794f6">在 Kiro 中安装 · 也适配其他编码 Agent</text>
  <g font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', Helvetica, Arial, sans-serif" font-weight="700" font-size="11" fill="#b794f6">
    <text x="384" y="196" text-anchor="end" letter-spacing="1.5">查看项目</text>
    <text x="399" y="196" text-anchor="end">→
      <animate attributeName="x" values="399;404;399" dur="1.6s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
