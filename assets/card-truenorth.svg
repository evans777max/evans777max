<svg width="430" height="210" viewBox="0 0 430 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TrueNorth: single-file offline-first AI work navigator, 45 agent skills, 37 toolkits">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#0c1322"/>
      <stop offset="1" stop-color="#101c33"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2f62ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2f62ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tick" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f62ff"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <clipPath id="panelClip">
      <rect x="0.5" y="0.5" width="429" height="209" rx="16"/>
    </clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="429" height="209" rx="16" fill="url(#panel)" stroke="#26334d"/>
  <g clip-path="url(#panelClip)">
    <circle cx="392" cy="10" r="105" fill="url(#orb)">
      <animate attributeName="r" values="105;120;105" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- accent tick + compass icon + title -->
  <rect x="28" y="24" width="44" height="4" rx="2" fill="url(#tick)"/>
  <g transform="translate(41 55)" stroke="#7ea6ff" fill="none" stroke-width="1.8">
    <circle r="12"/>
    <path d="M 4.5 -4.5 L 1.5 1.5 L -4.5 4.5 L -1.5 -1.5 Z" fill="#7ea6ff" stroke="none"/>
  </g>
  <text x="62" y="61" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" font-weight="800" font-size="24" fill="#e6edf3">TrueNorth 指北</text>

  <!-- corner tag -->
  <rect x="330" y="22" width="72" height="20" rx="10" fill="none" stroke="#2f62ff" stroke-opacity="0.55"/>
  <text x="366" y="36" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="9" letter-spacing="2" fill="#7ea6ff">FLAGSHIP</text>

  <!-- tagline -->
  <text x="28" y="90" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#94a3b8">Single-file, offline-first AI work navigator</text>
  <text x="28" y="109" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#94a3b8">built around a Skill-first workflow.</text>

  <!-- chips -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#9fb3d6">
    <rect x="28" y="124" width="112" height="24" rx="12" fill="#16233d" stroke="#2f62ff" stroke-opacity="0.45"/>
    <text x="84" y="140" text-anchor="middle">45 agent skills</text>
    <rect x="148" y="124" width="90" height="24" rx="12" fill="#16233d" stroke="#2f62ff" stroke-opacity="0.45"/>
    <text x="193" y="140" text-anchor="middle">37 toolkits</text>
    <rect x="246" y="124" width="82" height="24" rx="12" fill="#16233d" stroke="#2f62ff" stroke-opacity="0.45"/>
    <text x="287" y="140" text-anchor="middle">AI signals</text>
    <rect x="28" y="154" width="96" height="24" rx="12" fill="#16233d" stroke="#06b6d4" stroke-opacity="0.45"/>
    <text x="76" y="170" text-anchor="middle">offline-first</text>
    <rect x="132" y="154" width="102" height="24" rx="12" fill="#16233d" stroke="#06b6d4" stroke-opacity="0.45"/>
    <text x="183" y="170" text-anchor="middle">source graph</text>
  </g>

  <!-- footer -->
  <text x="28" y="196" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#06b6d4">true-north-ev.netlify.app</text>
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="11" fill="#7ea6ff">
    <text x="384" y="196" text-anchor="end" letter-spacing="1.5">EXPLORE</text>
    <text x="396" y="196" text-anchor="end">→
      <animate attributeName="x" values="396;401;396" dur="1.6s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
